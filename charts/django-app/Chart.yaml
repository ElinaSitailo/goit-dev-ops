apiVersion: v2
name: django-app
description: Helm chart to setup a Django application with PostgreSQL database in Kubernetes.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "16.4.4"
    repository: "https://charts.bitnami.com/bitnami"
  - name: metrics-server
    version: "3.12.1"
    repository: "https://kubernetes-sigs.github.io/metrics-server/"
