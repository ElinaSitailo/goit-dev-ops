# --------------------------------------------------------------------------------------------------
#                               IMAGE PARAMETERS
#                               Override at deploy time:
#                               --set image.repository=<account>.dkr.ecr.eu-north-1.amazonaws.com/lesson-5-ecr
# --------------------------------------------------------------------------------------------------
image:
  repository: "694024477691.dkr.ecr.eu-north-1.amazonaws.com/lesson-5-ecr"
  tag: "20-3122f83"
  pullPolicy: "Always"

# --------------------------------------------------------------------------------------------------
#                              REPLICAS PARAMETERS
# --------------------------------------------------------------------------------------------------
replicaCount: 1

# --------------------------------------------------------------------------------------------------
#                               SERVICE PARAMETERS
# --------------------------------------------------------------------------------------------------
service:
  type: "LoadBalancer"
  port: 80
  targetPort: 8000

# --------------------------------------------------------------------------------------------------
#                               Horizontal Pod Autoscaler PARAMETERS
# --------------------------------------------------------------------------------------------------
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80

# --------------------------------------------------------------------------------------------------
#                               CONTAINER PARAMETERS
# --------------------------------------------------------------------------------------------------
container:
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# --------------------------------------------------------------------------------------------------
#                               SECRET PARAMETERS (never commit real values)
#                               Pass via: --set secret.databasePassword=$TF_VAR_database_password
#                                         --set secret.djangoSecretKey=$TF_VAR_django_secret_key
# --------------------------------------------------------------------------------------------------
secret:
  databasePassword: ""
  djangoSecretKey: ""

# --------------------------------------------------------------------------------------------------
#                               ENVIRONMENT VARIABLES
# --------------------------------------------------------------------------------------------------
config:
  DJANGO_SETTINGS_MODULE: "app.settings"
  DJANGO_ALLOWED_HOSTS: ""
  DEBUG: "False"
  DATABASE_ENGINE: "django.db.backends.postgresql"
  DATABASE_HOST: "django-app-postgresql"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "django_db"
  DATABASE_USER: "django_user"

# --------------------------------------------------------------------------------------------------
#                               POSTGRESQL (bitnami/postgresql subchart)
#                               Password is injected at deploy time via --set
# --------------------------------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    registry: "registry-1.docker.io"
    repository: "bitnami/postgresql"
    tag: "latest"
    digest: ""
  auth:
    username: "django_user"
    database: "django_db"
    password: ""
  primary:
    persistence:
      # Dev-friendly default: avoids PVC provisioning blockers on fresh EKS clusters
      # that don't have a working default StorageClass / EBS CSI driver yet.
      enabled: false

# --------------------------------------------------------------------------------------------------
#                               METRICS SERVER
#                               Required for HPA to read CPU/memory metrics
# --------------------------------------------------------------------------------------------------
metrics-server:
  args:
  - --kubelet-insecure-tls
